[package]
name = "lmtranslate"
version = "0.1.3"
description = "System-wide translation from a global hotkey"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
async-trait = "0.1.91"
base64 = "0.23.0"
bzip2 = "0.6.1"
chrono = "0.4.45"
enigo = "0.6.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
libloading = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "charset", "http2", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = "0.4.46"
# macos-private-api is what makes the transparent popup work on macOS; it is paired
# with "macOSPrivateApi": true in tauri.conf.json.
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["time", "sync", "rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Screen capture on Windows and macOS only.
#
# Not on Linux: xcap depends unconditionally on `pipewire`, whose -sys crate binds against
# the system SPA headers. That pins the build to a very recent PipeWire (it fails to
# compile against the 0.3.48 headers on Ubuntu 22.04) and drags in a wlroots screencopy
# stack this app never uses, because the Wayland backend goes through xdg-desktop-portal.
# Linux captures with x11rb (X11) and ashpd (Wayland) instead — both pure Rust.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = { version = "0.9.7", features = ["image"] }

# Windows only: the foreground-window bookkeeping that hands focus back to the app holding
# the selection, the menu-mask keystroke, and the low-level mouse hook that notices a
# selection being made so the bubble can offer to translate it.
#
# keyring keeps the API keys in Credential Manager rather than in settings.json.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Linux only. Wayland sandboxes input injection and screen capture, so both flows need
# genuinely different backends there: ashpd (xdg-desktop-portal) for capture, and the
# primary-selection protocol via wl-clipboard-rs for text. x11-clipboard gives X11 the
# PRIMARY fast path that skips the simulate-copy step entirely, and x11rb provides the
# GetImage call that is all X11 region capture actually needs.
#
# keyring talks to the Secret Service (GNOME Keyring, KWallet) over pure-Rust zbus, so the
# build needs no libdbus headers. async-io rather than tokio: keyring's blocking calls
# must not try to start a runtime inside Tauri's.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.12.3"
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }
wl-clipboard-rs = "0.9.3"
x11-clipboard = "0.9.3"
x11rb = "0.13.2"
arboard = { version = "3.6.1", features = ["wl-clipboard-rs"] }

# macOS keeps the API keys in the login Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
